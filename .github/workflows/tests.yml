name: Python tests and Docker integration
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt httpx==0.28.1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Start Docker microservices
        run: docker compose up --build -d --wait
      - name: Run real order and event integration test
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,subprocess,time,urllib.request
          for i in range(45):
              logs=subprocess.run(['docker','compose','logs','--no-color','notification'],capture_output=True,text=True).stdout
              if 'notification worker ready' in logs: break
              time.sleep(2)
          else: raise RuntimeError('Notification worker never became ready')
          body=json.dumps({'customer_email':'student@example.com','item':'Notebook','quantity':2}).encode()
          req=urllib.request.Request('http://localhost:8000/orders',body,headers={'Content-Type':'application/json','Idempotency-Key':'ci-proof-001'},method='POST')
          with urllib.request.urlopen(req,timeout=15) as response:
              data=json.load(response)
              assert response.status==202
          assert data['status']=='accepted'
          with open('evidence/order-response.json','w') as f:json.dump(data,f,indent=2)
          correlation=data['correlation_id']
          for i in range(45):
              logs=subprocess.run(['docker','compose','logs','--no-color','order','notification'],capture_output=True,text=True).stdout
              if 'event published correlation_id='+correlation in logs and 'event consumed correlation_id='+correlation in logs:
                  break
              time.sleep(2)
          else: raise AssertionError('Did not observe event published and consumed with matching correlation ID')
          with open('evidence/service-logs.txt','w') as f:f.write(logs)
          with open('evidence/verification.txt','w') as f:f.write('PASS: HTTP 202, OrderPlaced published, consumed, matching correlation ID: '+correlation+'\n')
          print(json.dumps(data,indent=2))
          print('PASS: published and consumed event with matching correlation ID:',correlation)
          PY
      - name: Upload real execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maltashop-execution-evidence
          path: evidence/
          if-no-files-found: ignore
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --no-color
